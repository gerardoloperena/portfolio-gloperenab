<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">GLB</title>

  <style>
    .background {
      fill: #75583a;
    }

    .border {
      fill: none;
      stroke: #a9825a;
    }

    .letters {
      fill: #fffaf3;
    }

    @media (prefers-color-scheme: dark) {
      .background {
        fill: #111827;
      }

      .border {
        stroke: #6694ff;
      }

      .letters {
        fill: #dce7ff;
      }
    }
  </style>

  <rect class="background" x="2" y="2" width="60" height="60" rx="16" />
  <rect class="border" x="5" y="5" width="54" height="54" rx="13" stroke-width="3" />
  <text
    class="letters"
    x="32"
    y="39.5"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="20"
    font-weight="800"
    letter-spacing="0.3"
  >
    GLB
  </text>
</svg>
